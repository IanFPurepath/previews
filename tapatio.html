<!doctype html>
<html lang="en">
<head>

<body style="margin:0">
<title>Taquería El Tapatío</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
body{margin:0;background:#141013;color:#f7efe2;font-family:"Archivo",system-ui,sans-serif}
a{color:#ffb000}a:hover{color:#fff}
.tc *{box-sizing:border-box}
.tc .wall{background-color:#141013;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:90px 44px,180px 44px}
.tc .wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tc .neon{font-family:"Monoton",cursive;font-weight:400;color:#ffd6de;text-shadow:0 0 6px #ff2a55,0 0 18px #ff2a55,0 0 42px #ff2a55,0 0 80px #ff2a55;animation:flick 6s infinite}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
.tc .neon2{font-family:"Monoton",cursive;color:#d9fff6;text-shadow:0 0 6px #00e0b0,0 0 20px #00e0b0,0 0 50px #00e0b0}
.tc .led{font-family:"VT323",ui-monospace,monospace;color:#ffb000;text-shadow:0 0 8px rgba(255,176,0,.6)}
.tc .tick{display:flex;width:max-content;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.tc .pos{display:grid;grid-template-columns:200px minmax(0,1fr) 360px;gap:18px;align-items:start}
.tc .cat{all:unset;cursor:pointer;padding:14px 16px;border-radius:12px;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.tc .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tc .tile{all:unset;cursor:pointer;background:#f7efe2;color:#141013;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:132px;position:relative;transition:transform .12s, box-shadow .12s;box-shadow:0 6px 0 #c9b99f}
.tc .tile:hover{transform:translateY(-3px)}
.tc .tile:active{transform:translateY(4px);box-shadow:0 2px 0 #c9b99f}
.tc .tile:focus-visible,.tc .cat:focus-visible,.tc .q:focus-visible{outline:3px solid #00e0b0;outline-offset:3px}
.tc .q{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:900;background:#2a2228;color:#f7efe2}
.tc .ticket{background:#fffdf7;color:#141013;border-radius:6px;padding:20px;box-shadow:0 30px 60px -30px #000;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),95% 100%,90% calc(100% - 10px),85% 100%,80% calc(100% - 10px),75% 100%,70% calc(100% - 10px),65% 100%,60% calc(100% - 10px),55% 100%,50% calc(100% - 10px),45% 100%,40% calc(100% - 10px),35% 100%,30% calc(100% - 10px),25% 100%,20% calc(100% - 10px),15% 100%,10% calc(100% - 10px),5% 100%,0 calc(100% - 10px))}
.tc .info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.tc .pos{grid-template-columns:minmax(0,1fr) 340px}.tc .cats{grid-column:1/-1;flex-direction:row!important;flex-wrap:wrap}}
@media (max-width:820px){.tc .pos{grid-template-columns:1fr}.tc .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tc .info{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tc *{animation:none!important;transition:none!important}}
</style>
<template id="dc-tpl">

      </aside>
    </div>
  </main>

  <section id="birria" style="background:#f7efe2;color:#141013;padding-block:90px">
    <div class="wrap">
      <span class="led" style="font-size:24px;color:#c4122f;text-shadow:none">HOW TO EAT BIRRIA</span>

        <div style="background:#c4122f;color:#fff;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px"><b class="led" style="font-size:64px;line-height:.8;color:#ffd166;text-shadow:none">02</b><b style="font-size:24px">Bite</b><p style="margin:0;line-height:1.5">Slow-braised beef, onion, cilantro and a squeeze of lime. Repeat until gone.</p></div>
        <div style="background:#00e0b0;color:#141013;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px"><b class="led" style="font-size:64px;line-height:.8;color:#141013;text-shadow:none">03</b><b style="font-size:24px">Sip</b><p style="margin:0;line-height:1.5">Drink what's left of the consomé. That's the best part. Add another cup for $8.99.</p></div>
      </div>
    </div>
  </section>

  <section class="wrap" style="padding-block:90px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px;align-items:center">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <span class="led" style="font-size:24px">THE STORY</span>
        <h2 class="neon2" style="margin:0;font-weight:400;font-size:clamp(32px,4.4vw,60px);line-height:1.1">Jalisco style, east end soul</h2>
        <p style="margin:0;font-size:18px;line-height:1.6;color:#d8ccd2;max-width:52ch">“Tapatío” means someone from Guadalajara, the home of birria. That's the cooking at 915 Danforth: slow braises, warm corn tortillas and a red salsa with real heat, served fast and in generous portions.</p>
        <p style="margin:0;font-size:18px;line-height:1.6;color:#d8ccd2;max-width:52ch">Feeding a crowd? Carnitas, pastor, chorizo and pollo come by the kilo for taco night at home.</p>

        </sc-for>

  </section>

  <section class="wrap" style="padding-bottom:90px">

      <div style="border:2px solid #00e0b0;border-radius:20px;padding:24px;box-shadow:0 0 30px -10px #00e0b0"><span class="led" style="font-size:22px;color:#00e0b0">HOURS</span>

      <span class="led" style="font-size:18px;color:#a99aa3;text-shadow:none">915 DANFORTH AVE · (437) 477-1293 · CONCEPT BY IAN</span>
    </div>
  </footer>
</div>
</template>

    const add = (n,dq)=>{ const c={...this.state.cart}; c[n]=(c[n]||0)+dq; if(c[n]<=0) delete c[n]; this.setState({cart:c}); };
    const cats = Object.keys(M).map(n=>({name:n, sel:String(n===cat), pick:()=>this.setState({cat:n}),
      style: n===cat ? 'background:#ff2a55;color:#fff;box-shadow:0 0 24px -4px #ff2a55' : 'background:#231c21;color:#d8ccd2'}));
    const tiles = M[cat].map(([n,d,p])=>({n,d,price:money(p),qty:cart[n]||0,has:!!cart[n],add:()=>add(n,1),aria:'Add '+n+', '+money(p)}));
    const lines = Object.keys(cart).map(n=>({n,qty:cart[n],sum:money(all[n][2]*cart[n]),inc:()=>add(n,1),dec:()=>add(n,-1)}));
    const sub = Object.keys(cart).reduce((s,n)=>s+all[n][2]*cart[n],0);
    const names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const H={0:[12,20],1:[12,22],3:[12,22],4:[12,22],5:[12,22],6:[12,22]};
    const fmt=h=>{const hh=Math.floor(h);return (((hh+11)%12)+1)+(hh>=12?' p.m.':' a.m.');};
    let now; try { now = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Toronto'})); } catch(e){ now = new Date(); }
    const d=now.getDay();
    const hours=[1,2,3,4,5,6,0].map(i=>({day:names[i],t:H[i]?fmt(H[i][0])+' – '+fmt(H[i][1]):'Closed',
      style:'display:flex;justify-content:space-between;padding:4px 0;font-size:15px;'+(i===d?'color:#00e0b0;font-weight:900':'color:#d8ccd2')}));
    const tk = ['★ BIRRIA TACO $7.50','★ 3 QUESABIRRIAS + DRINK $21.50','★ 915 DANFORTH AVE','★ PAN DE MUERTO IS BACK','★ CARNITAS BY THE KILO $75','★ CLOSED TUESDAYS','★ 5.0 ON GOOGLE','★ CALL (437) 477-1293'];
    const reviews = [['Best tacos on the Danforth by far.','GOOGLE REVIEW'],['The food was fresh, piping hot, and the portions were very generous.','GOOGLE REVIEW'],['Super friendly staff and such a kind, welcoming owner.','GOOGLE REVIEW']].map(([q,s])=>({q,s}));
    const FQ=[['Do you deliver?','Yes, through Uber Eats. You can also call (437) 477-1293 and pick up.'],['Is there anything vegetarian?','Mushroom and cactus (nopal) tacos, quesadillas and mulitas, plus guacamole and chips.'],['Can I order for a party?','Order meat by the kilo: carnitas, pastor, pollo or chorizo $75, sirloin or lengua $85. Call a day ahead.'],['Are you open Tuesdays?','No, Tuesday is our day off. Every other day from noon.']];
    const faq = FQ.map(([q,a],i)=>({q,a,isOpen:this.state.faq===i,open:String(this.state.faq===i),sign:this.state.faq===i?'−':'+',toggle:()=>this.setState({faq:this.state.faq===i?-1:i})}));
    return { reviews, faq, cats, tiles, lines, empty: lines.length===0, sub:money(sub), tax:money(sub*.13), total:money(sub*1.13),
      time: String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'), hours, ticker: tk.concat(tk) };
  }
}

__dcBoot(Component);
