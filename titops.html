<style>
body{margin:0;background:#8fd3ff;color:#101734;font-family:"Archivo",system-ui,sans-serif}
a{color:#0038a8}a:hover{color:#00246e}
.jp *{box-sizing:border-box}
.jp .wrap{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.jp .dg{font-family:"Dela Gothic One","Arial Black",sans-serif;font-weight:400}
.jp .cloud{position:absolute;background:#fff;border-radius:999px;animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.jp .jeep{position:absolute;bottom:56px;width:min(300px,38vw);transform:translateX(-50%);transition:left 1.4s cubic-bezier(.6,.05,.3,1)}
.jp .bounce{animation:bob .35s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.jp .wheel{position:absolute;bottom:-18%;width:22%;aspect-ratio:1/1;border-radius:50%;background:#1b1b1f;border:6px solid #c9d1d9}
.jp .spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jp .dash{position:absolute;left:0;right:0;top:50%;height:6px;background:repeating-linear-gradient(90deg,#fcd116 0 50px,transparent 50px 100px);animation:road 1.2s linear infinite}
@keyframes road{to{background-position:-100px 0}}
.jp .stops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.jp .stop{all:unset;cursor:pointer;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.jp .stop:hover{transform:translateY(-3px)}
.jp .stop:focus-visible,.jp .opt:focus-visible{outline:3px solid #ce1126;outline-offset:3px}
.jp .opt{all:unset;cursor:pointer;padding:14px 16px;border-radius:14px;display:flex;justify-content:space-between;gap:10px;font-weight:800}
.jp .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.jp .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.jp .panel{animation:in .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes in{from{transform:translateY(24px);opacity:.3}}
@media (max-width:860px){.jp .split{grid-template-columns:1fr}.jp .stops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.jp .opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.jp *{animation:none!important;transition:none!important}}
</style>

<script>(function(){
  function lookup(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;

  function interp(str, scope){ return str.replace(ANY, function(_, p){ var v = lookup(p, scope); return v == null ? '' : String(v); }); }

      list.forEach(function(item, i){ var s = Object.create(scope); s[as] = item; s.$index = i; node.childNodes.forEach(function(c){ build(c, s, out); }); });
      return;
    }

      var v = lookup((node.getAttribute('value')||'').replace(/[{}]/g,''), scope);
      if (v) node.childNodes.forEach(function(c){ build(c, scope, out); });
      return;
    }

    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(tag);

      if (/^on[a-z]+$/i.test(name)){ if (m){ var fn = lookup(m[1], scope); if (typeof fn === 'function') el.__h[name.slice(2).toLowerCase()] = fn; } continue; }
      if (m){ var raw = lookup(m[1], scope); if (raw === false || raw == null) continue; val = String(raw); }
      else if (val.indexOf('{{') > -1) val = interp(val, scope);

    }

  }
  function deepWire(n){ if (n.nodeType !== 1) return; wire(n); n.querySelectorAll('*').forEach(wire); }
  window.DCLogic = function(props){ this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function(p){ var s = typeof p === 'function' ? p(this.state) : p; this.state = Object.assign({}, this.state, s); this.__render(); };
  DCLogic.prototype.forceUpdate = function(){ this.__render(); };

    var tpl = document.getElementById('dc-tpl'), root = document.getElementById('dc-root');

    const FQ=[['What does “silog” mean?','It’s sinangag (garlic fried rice) plus itlog (egg) plus your ulam. Tapa makes it tapsilog, tocino makes it tosilog, and so on.'],['Do you deliver?','Yes, on Uber Eats. Or call or WhatsApp (647) 993-4419 for pickup.'],['Can you cater a student event?','Yes. Trays of inasal and silog for clubs, birthdays and study nights. Message us a few days ahead.'],['Where are you exactly?','Unit G in the University City plaza at 45 Four Winds Dr, a short walk from York U and Finch West station.']];
